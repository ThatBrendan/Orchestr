<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <title>Connection unavailable | Orchestrio</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #111; background: #fff; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(32rem, calc(100% - 3rem)); }
      h1 { font-size: clamp(1.8rem, 7vw, 2.5rem); letter-spacing: -.04em; }
      p { color: #555; line-height: 1.65; }
      button { margin-top: 1rem; border: 0; border-radius: .6rem; padding: .8rem 1.1rem; color: white; background: #111; font: inherit; font-weight: 650; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <p>ORCHESTRIO</p>
      <h1>You’re offline</h1>
      <p>Connect to the internet to load this page. Project data may be out of date, and Orchestrio does not save project changes while offline.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
